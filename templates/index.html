<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Movement Analyzer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Stock Movement Analyzer</h1>
            <p class="subtitle">전일 주가 변동 원인 분석기</p>
        </header>

        <!-- Global Indices Section -->
        <section class="card indices-section">
            <div class="section-header">
                <h2>글로벌 주요 지수</h2>
                <span id="indicesDate" class="indices-date"></span>
                <button id="indicesBtn" class="btn btn-indices">조회</button>
            </div>

            <!-- Loading -->
            <div id="indicesLoading" style="display:none;">
                <div class="spinner small-spinner"></div>
                <p id="indicesLoadingText" class="indices-loading-text">데이터 수집 중...</p>
            </div>

            <!-- Index Tables -->
            <div id="indicesData" style="display:none;">
                <div class="indices-regions">
                    <div class="indices-region">
                        <h3 class="region-title us-title">🇺🇸 미국</h3>
                        <div id="usIndices" class="index-list"></div>
                    </div>
                    <div class="indices-region">
                        <h3 class="region-title asia-title">🌏 아시아</h3>
                        <div id="asiaIndices" class="index-list"></div>
                    </div>
                    <div class="indices-region">
                        <h3 class="region-title eu-title">🇪🇺 유럽</h3>
                        <div id="euIndices" class="index-list"></div>
                    </div>
                </div>
            </div>

            <!-- News Summary -->
            <div id="indicesNews" style="display:none;">
                <div class="news-divider"></div>
                <h3 class="news-title">뉴스 &amp; 시장 분석 <span class="news-badge">Gemini 2.5 Pro</span></h3>
                <div id="newsSummaryText" class="news-content"></div>
            </div>
        </section>

        <!-- Ticker Input Section -->
        <section class="card ticker-input-section">
            <h2>Ticker 등록</h2>
            <div class="input-group">
                <input type="text" id="tickerInput" placeholder="예: AAPL, 005930.KS"
                       autocomplete="off" spellcheck="false">
                <button id="addBtn" class="btn btn-add">추가</button>
            </div>
            <p class="hint">미국 주식: AAPL, TSLA / 한국 주식: 005930.KS (삼성전자), 000660.KS (SK하이닉스)</p>
        </section>

        <!-- Saved Tickers Section -->
        <section class="card ticker-list-section">
            <div class="section-header">
                <h2>등록된 Tickers</h2>
                <span id="tickerCount" class="badge">0</span>
                <button id="clearAllBtn" class="btn btn-clear">전체 삭제</button>
            </div>
            <div id="tickerList" class="ticker-list">
                <p class="empty-message">등록된 Ticker가 없습니다. 위에서 추가해주세요.</p>
            </div>
            <button id="analyzeBtn" class="btn btn-analyze" disabled>
                <span class="btn-icon">&#9654;</span> 분석 실행
            </button>
        </section>

        <!-- Loading Section -->
        <section id="loadingSection" class="card loading-section" style="display:none;">
            <div class="spinner"></div>
            <p id="loadingText">주가 데이터를 수집하고 있습니다...</p>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </section>

        <!-- Results Section -->
        <section id="resultsSection" class="card results-section" style="display:none;">
            <h2>분석 결과</h2>

            <!-- All stocks overview -->
            <div id="allStocksOverview" class="stocks-overview"></div>

            <!-- Filtered analysis results -->
            <div id="analysisResults"></div>
        </section>

        <!-- Error Section -->
        <section id="errorSection" class="card error-section" style="display:none;">
            <p id="errorText"></p>
        </section>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
